<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دردشة برتقالية</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script defer src="script.js"></script>
</head>
<body class="bg-white text-gray-800 font-sans">
  <div class="bg-orange-500 text-white text-center py-4 text-2xl font-bold">
    دردشة مباشرة
  </div>

  <div class="max-w-3xl mx-auto p-4 space-y-6">

    <!-- إدخال اسم المستخدم -->
    <div class="flex gap-2">
      <input id="username" type="text" placeholder="اسمك" class="border p-2 rounded w-full">
      <button onclick="saveUsername()" class="bg-orange-500 text-white px-4 py-2 rounded">حفظ</button>
    </div>

    <!-- البحث عن مستخدم -->
    <div class="flex gap-2">
      <input id="searchUser" type="text" placeholder="ابحث عن مستخدم" class="border p-2 rounded w-full">
      <button onclick="startChat()" class="bg-orange-500 text-white px-4 py-2 rounded">ابدأ الدردشة</button>
    </div>

    <!-- نافذة المحادثة -->
    <div id="chatBox" class="border border-orange-300 rounded-lg h-80 overflow-y-auto p-4 bg-orange-50 hidden">
      <div class="text-center text-gray-600">ابدأ الدردشة لعرض الرسائل</div>
    </div>

    <!-- إرسال رسالة -->
    <div id="messageForm" class="flex gap-2 hidden">
      <input id="messageInput" type="text" placeholder="اكتب رسالة..." class="border p-2 rounded w-full">
      <button onclick="sendMessage()" class="bg-orange-500 text-white px-4 py-2 rounded">إرسال</button>
    </div>
  </div>
</body>
</html>
