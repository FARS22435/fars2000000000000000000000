<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دردشة برتقالية</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script defer src="script.js"></script>
</head>
<body class="bg-white text-gray-800 font-sans">
  <div class="bg-orange-500 text-white text-center py-4 text-2xl font-bold">
    دردشة مباشرة
  </div>

  <div class="max-w-3xl mx-auto p-4 space-y-6">

    <!-- إدخال اسم المستخدم -->
    <div class="flex gap-2">
      <input id="username" type="text" placeholder="اسمك" class="border p-2 rounded w-full sm:w-1/2 md:w-1/3 lg:w-1/4">
      <button onclick="saveUsername()" class="bg-orange-500 text-white px-4 py-2 rounded">حفظ</button>
    </div>

    <!-- البحث عن مستخدم -->
    <div class="flex gap-2">
      <input id="searchUser" type="text" placeholder="ابحث عن مستخدم" class="border p-2 rounded w-full sm:w-1/2 md:w-1/3 lg:w-1/4">
      <button onclick="startChat()" class="bg-orange-500 text-white px-4 py-2 rounded">ابدأ الدردشة</button>
    </div>

    <!-- نافذة المحادثة -->
    <div id="chatBox" class="border border-orange-300 rounded-lg h-80 overflow-y-auto p-4 bg-orange-50 hidden">
      <div class="text-center text-gray-600">ابدأ الدردشة لعرض الرسائل</div>
    </div>

    <!-- إرسال رسالة -->
    <div id="messageForm" class="flex gap-2 hidden">
      <input id="messageInput" type="text" placeholder="اكتب رسالة..." class="border p-2 rounded w-full sm:w-2/3 md:w-1/2 lg:w-1/3">
      <button onclick="sendMessage()" class="bg-orange-500 text-white px-4 py-2 rounded">إرسال</button>
    </div>

    <!-- إشعارات المستخدمين -->
    <div id="notifications" class="mt-6 border p-4 rounded-lg bg-orange-50">
      <h3 class="text-xl font-bold mb-4">إشعارات الرسائل</h3>
      <div id="notificationList" class="space-y-2">
        <!-- إشعارات الرسائل ستظهر هنا -->
      </div>
    </div>
  </div>

  <script>
    // إعداد Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCAUQs04D6f1hl2tCBzGp9oYuoWKLmJtjI",
      authDomain: "nimble-artwork-452619-b5.firebaseapp.com",
      databaseURL: "https://nimble-artwork-452619-b5-default-rtdb.firebaseio.com",
      projectId: "nimble-artwork-452619-b5",
      storageBucket: "nimble-artwork-452619-b5.firebasestorage.app",
      messagingSenderId: "211952503774",
      appId: "1:211952503774:web:dbb27abd162a6b1435eb4f",
      measurementId: "G-SLY9NRNDVD"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentUser = "";
    let chatWith = "";

    function saveUsername() {
      const name = document.getElementById("username").value.trim();
      if (name) {
        currentUser = name;
        alert("تم حفظ اسم المستخدم: " + name);
      } else {
        alert("الرجاء إدخال اسمك");
      }
    }

    function startChat() {
      const otherUser = document.getElementById("searchUser").value.trim();
      if (!currentUser) {
        alert("الرجاء حفظ اسم المستخدم أولاً");
        return;
      }

      if (otherUser) {
        chatWith = otherUser;
        document.getElementById("chatBox").classList.remove("hidden");
        document.getElementById("messageForm").classList.remove("hidden");
        document.getElementById("chatBox").innerHTML = ""; // تفريغ القديم
        listenForMessages();
      } else {
        alert("يرجى إدخال اسم المستخدم الذي تريد الدردشة معه");
      }
    }

    function sendMessage() {
      const messageInput = document.getElementById("messageInput");
      const message = messageInput.value.trim();

      if (message && currentUser && chatWith) {
        const chatId = getChatId(currentUser, chatWith);
        const timestamp = Date.now();

        db.ref("chats/" + chatId).push({
          sender: currentUser,
          message,
          timestamp
        });

        messageInput.value = "";
      }
    }

    function listenForMessages() {
      const chatId = getChatId(currentUser, chatWith);
      const chatBox = document.getElementById("chatBox");
      chatBox.innerHTML = "";

      db.ref("chats/" + chatId).off(); // لإلغاء المستمع القديم
      db.ref("chats/" + chatId).on("child_added", (snapshot) => {
        const data = snapshot.val();
        const msgHTML = `
          <div class="${data.sender === currentUser ? 'text-right' : 'text-left'} mb-2">
            <div class="inline-block px-3 py-1 rounded-full ${data.sender === currentUser ? 'bg-orange-500 text-white' : 'bg-gray-200 text-black'}">
              ${data.sender}: ${data.message}
            </div>
          </div>
        `;
        chatBox.innerHTML += msgHTML;
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    function getChatId(user1, user2) {
      return [user1, user2].sort().join("_");
    }
  </script>
</body>
</html>
